[package]
name = "dutime"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytesize = "2.7.0"
clap = { version = "4.6.6", features = ["derive"] }
globset = "0.4.20"
humantime = "2.4.0"
ignore = "0.4.33"
rayon = "1.12.0"
rusqlite = { version = "0.40.2", features = ["bundled", "backup", "functions", "limits"] }
rustix = { version = "1.1.4", features = ["fs", "process", "thread"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"
