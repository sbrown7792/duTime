[package]
name = "dutime"
version = "0.5.6"
edition = "2024"
build = "build.rs"
description = "Track disk usage over time"
license = "AGPL-3.0-or-later"
# Single source for the link in the web UI's footer and anywhere else that
# needs it; read at compile time via CARGO_PKG_REPOSITORY.
repository = "https://github.com/sbrown7792/duTime"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
bytesize = "2.7.0"
clap = { version = "4.6.6", features = ["derive"] }
globset = "0.4.20"
humantime = "2.4.0"
ignore = "0.4.33"
mime_guess = "2.0.5"
rayon = "1.12.0"
rusqlite = { version = "0.40.2", features = ["bundled", "backup", "functions", "limits"] }
rust-embed = { version = "8.12.0", features = ["mime-guess"] }
rustix = { version = "1.1.4", features = ["fs", "process", "thread"] }
sd-notify = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "time"] }
toml = "1.1.6"
tower-http = { version = "0.7.1", features = ["compression-gzip", "compression-br", "trace", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5.3", features = ["util"] }
